matrix:
  RUST: [stable]

steps:
  test-rust:
    image: rust
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - rustup default $RUST
      - cargo check
      - cargo test
    when:
      - event: [push, pull_request, tag]
        path: ['src/*', 'test/*', 'grammar.js', 'package.json', '.woodpecker.yml']
        branch: [main, dev]

  test-nodejs:
    image: node:trixie
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install --no-install-recommends --yes build-essential
      - apt install --no-install-recommends --yes nodejs node-corepack
      - yarnpkg install --immutable
      - yarnpkg run tree-sitter generate
      - yarnpkg run tree-sitter test
    when:
      - event: [push, pull_request, tag]
        path: ['src/*', 'test/*', 'grammar.js', 'package.json', '.woodpecker.yml']
        branch: [main, dev]
